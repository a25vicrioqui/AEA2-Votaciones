services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ./servidor
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./servidor:/usr/src/app
      - /usr/src/app/node_modules